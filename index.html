<style>
*{box-sizing:border-box}
body{

header{

#progressBar{

}
.quiz-question button{display:block;width:100%;text-align:left}

.back{background:#46536e}
footer{text-align:center;color:#aab5d0;padding:25px}

</head>

<body>

<header>

</header>

<div class="container">

</select>

</select>

</div>

</div>
</section>

</div>
</section>

</div>

<footer>My Student World | Learn • Practice • Grow</footer>

<script>
let student = "";
let points = 0;
let completedLessons = [];
let currentLesson = 0;
let quizScore = 0;

const lessons = [

{
title:"Lesson 1: Introduction to HTML",
content:`
<h3>1. What is HTML?</h3>
<p>HTML stands for HyperText Markup Language.</p>
<p>HTML is used to create web pages. It tells the browser how to show text, images, links and other content.</p>

<h3>2. What is a Web Page?</h3>
<p>A web page is a document that we open in a web browser. Example: a college website page.</p>

<h3>3. What is a Browser?</h3>
<p>A browser is software used to open websites. Examples: Google Chrome, Firefox and Microsoft Edge.</p>

<h3>4. What is an HTML Tag?</h3>
<p>An HTML tag is a keyword written inside angle brackets. Example: &lt;p&gt;.</p>

<h3>Example Code</h3>
<pre>&lt;h1&gt;Hello Students&lt;/h1&gt;
&lt;p&gt;Welcome to My Website.&lt;/p&gt;</pre>

<h3>Output</h3>
<div class="output"><h2>Hello Students</h2><p>Welcome to My Website.</p></div>

<h3>Remember</h3>
<p>HTML = Structure of a Web Page.</p>

<h3>Practice</h3>
<p>1. Write the full form of HTML.</p>
<p>2. Why do we use HTML?</p>
`,
quiz:[
["What is the full form of HTML?",["HyperText Markup Language","HighText Machine Language","Home Tool Markup Language"],0],
["HTML is used to create:",["Games only","Web pages","Operating systems"],1],
["Which software opens a website?",["Browser","Calculator","Paint"],0]
]
},

{
title:"Lesson 2: Basic HTML Structure",
content:`
<h3>1. Basic Structure</h3>
<p>Every HTML page has a basic structure. It contains important tags.</p>

<h3>2. Important Tags</h3>
<p><b>&lt;!DOCTYPE html&gt;</b> - Tells the browser that this is an HTML5 document.</p>
<p><b>&lt;html&gt;</b> - The root element of the page.</p>
<p><b>&lt;head&gt;</b> - Contains page information.</p>
<p><b>&lt;title&gt;</b> - Sets the browser tab title.</p>
<p><b>&lt;body&gt;</b> - Contains visible page content.</p>

<h3>Example Code</h3>
<pre>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;title&gt;My First Page&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;Welcome&lt;/h1&gt;
  &lt;p&gt;This is my first page.&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</pre>

<h3>Output</h3>
<div class="output"><h2>Welcome</h2><p>This is my first page.</p></div>

<h3>Remember</h3>
<p>Body = Visible content. Title = Browser tab name.</p>

<h3>Practice</h3>
<p>1. Which tag contains visible content?</p>
<p>2. Which tag sets the browser tab title?</p>
`,
quiz:[
["Which tag contains visible content?",["head","body","title"],1],
["Which tag sets the page title?",["title","p","h1"],0],
["Which declaration tells the browser HTML5?",["DOCTYPE html","body","head"],0]
]
},

{
title:"Lesson 3: HTML Basic Tags",
content:`
<h2>HTML Basic Tags</h2>

<p>HTML tags are used to create a web page.</p>

<h3>1. Heading Tags</h3>
<p>HTML has six heading tags from h1 to h6.</p>

<pre>
&lt;h1&gt;Heading 1&lt;/h1&gt;
&lt;h2&gt;Heading 2&lt;/h2&gt;
&lt;h3&gt;Heading 3&lt;/h3&gt;
&lt;h4&gt;Heading 4&lt;/h4&gt;
&lt;h5&gt;Heading 5&lt;/h5&gt;
&lt;h6&gt;Heading 6&lt;/h6&gt;
</pre>

<h3>2. Paragraph Tag</h3>
<p>The &lt;p&gt; tag is used to write a paragraph.</p>
<pre>&lt;p&gt;I am a student.&lt;/p&gt;</pre>

<h3>3. Break Tag</h3>
<p>The &lt;br&gt; tag 

moves text to a new line.</p>
<pre>Hello&lt;br&gt;Students</pre>

<h3>4. Horizontal Line Tag</h3>
<p>The &lt;hr&gt; tag creates a horizontal line.</p>
<pre>Hello&lt;hr&gt;Welcome</pre>

<h3>5. Bold Tag</h3>
<p>The &lt;b&gt; tag makes text bold.</p>
<pre>&lt;b&gt;My College&lt;/b&gt;</pre>

<h3>6. Italic Tag</h3>
<p>The &lt;i&gt; tag makes text italic.</p>
<pre>&lt;i&gt;Welcome&lt;/i&gt;</pre>

<h3>7. Underline Tag</h3>
<p>The &lt;u&gt; tag underlines text.</p>
<pre>&lt;u&gt;Student&lt;/u&gt;</pre>

<h3>Example Code</h3>
<pre>
&lt;h1&gt;My College&lt;/h1&gt;
&lt;p&gt;I am a student.&lt;/p&gt;
&lt;b&gt;Welcome&lt;/b&gt;
&lt;br&gt;Hello Students
&lt;hr&gt;
</pre>

<h3>Output</h3>
<div class="output">
<h1>My College</h1>
<p>I am a student.</p>
<b>Welcome</b><br>
Hello Students
<hr>
</div>

<p>1. Which tag is used for a paragraph?</p>
<p>2. Which tag creates a new line?</p>
<p>3. Which tag makes text bold?</p>

`,
quiz:[

},

<u>Underline Text</u><br><strong>Important Text</strong><br>
<em>Emphasized Text</em>
</div>

<h3>Practice</h3>
<p>1. Which tag makes text bold?</p>
<p>2. Which tag underlines text?</p>
`,
quiz:[
["Which tag makes text bold?",["i","b","u"],1],
["Which tag underlines text?",["u","p","br"],0],
["Which tag gives emphasis?",["em","hr","title"],0]
]
},

{
title:"Lesson 5: Links and Images",
content:`
<h3>1. Link Tag</h3>
<p>The &lt;a&gt; tag is used to create a hyperlink. The href attribute gives the link address.</p>

<h3>2. Image Tag</h3>
<p>The &lt;img&gt; tag is used to show an image.</p>

<h3>3. Important Attributes</h3>
<p><b>src</b> - Gives the image location.</p>
<p><b>alt</b> - Gives alternative text if the image cannot load.</p>
<p><b>href</b> - Gives the link address.</p>

<h3>Example Code</h3>
<pre>&lt;a href="https://example.com"&gt;
Visit Website
&lt;/a&gt;

&lt;img src="photo.jpg"
alt="My Photo" width="150"&gt;</pre>

<h3>Remember</h3>
<p>A link opens another page. An image displays a picture.</p>

<h3>Practice</h3>
<p>1. Which tag creates a link?</p>
<p>2. What is the use of src?</p>
`,
quiz:[
["Which tag creates a hyperlink?",["a","img","p"],0],
["Which attribute gives the link address?",["src","href","alt"],1],
["Which tag displays an image?",["image","img","picture"],1]
]
},

{
title:"Lesson 6: Lists and Tables",
content:`
<h3>1. Ordered List</h3>
<p>The &lt;ol&gt; tag creates a numbered list. Each item uses the &lt;li&gt; tag.</p>

<h3>2. Unordered List</h3>

  &lt;/tr&gt;

content:`

function startLearning(){
 student=document.getElementById("studentName").value.trim();
 let selectedCourse=document.getElementById("course").value;

 if(student===""){
  alert("Please enter your name.");
  return;
 }

 if(selectedCourse==="BA"){
  alert("BA Course is coming soon!");
  return;
 }

 document.getElementById("register").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
  let semester=document.getElementById("semester").value;
document.getElementById("courseTitle").innerText="📘 "+selectedCourse+" "+semester;
 showLessons();
}


function showLessons(){
 let list=document.getElementById("lessonList");
 list.innerHTML="";
 lessons.forEach((lesson,index)=>{
  let done=completedLessons.includes(index);
  let button=document.createElement("button");
  button.className="lesson";
  button.innerHTML=(done?"✅ ":"📘 ")+lesson.title+
  "<br><small>"+(done?"Completed":"Start Learning")+"</small>";
  button.onclick=()=>openLesson(index);
  list.appendChild(button);
 });
 updateProgress();
}

function openLesson(index){
 currentLesson=index;
 quizScore=0;
 let lesson=lessons[index];

 document.getElementById("dashboard").classList.add("hidden");
 document.getElementById("lessonPage").classList.remove("hidden");
 document.getElementById("lessonTitle").innerText=lesson.title;

 let quizHTML="<h2>🧠 Smart Quiz</h2><p>Choose the correct answer.</p>";

 lesson.quiz.forEach((question,qIndex)=>{
  quizHTML+=`<div class="quiz-question">
  <b>${qIndex+1}. ${question[0]}</b>
  <div>`;
  question[1].forEach((option,optionIndex)=>{
   quizHTML+=`<button class="answer"
   onclick="answerQuiz(this,${optionIndex===question[2]})">
   ${option}</button>`;
  });
  quizHTML+=`</div><p class="result"></p></div>`;
 });

 document.getElementById("lessonContent").innerHTML=
 lesson.content+quizHTML+
 '<button onclick="completeLesson()">Complete Lesson +10 Points ⭐</button>';
}

function answerQuiz(button,correct){
 let questionBox=button.parentElement.parentElement;
 let buttons=questionBox.querySelectorAll("button");
 buttons.forEach(btn=>btn.disabled=true);

 let result=questionBox.querySelector(".result");
 if(correct){
  result.innerText="Correct! Great job 🎉";
  quizScore++;
 }else{
  result.innerText="Not correct. Try again in your next practice.";
 }
}

function completeLesson(){
 if(!completedLessons.includes(currentLesson)){
  completedLessons.push(currentLesson);
  points+=10;
 }
 document.getElementById("points").innerText=points;
 document.getElementById("completed").innerText=completedLessons.length;
 goBack();
}

function updateProgress(){
 let percent=(completedLessons.length/lessons.length)*100;
 document.getElementById("progressBar").style.width=percent+"%";
 document.getElementById("points").innerText=points;
 document.getElementById("completed").innerText=completedLessons.length;
}

function goBack(){
 document.getElementById("lessonPage").classList.add("hidden");
 document.getElementById("dashboard").classList.remove("hidden");
 showLessons();
}
</script>

</body>
</html>
